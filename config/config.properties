# vault-graph bundled default config template
# This file is packaged with installer artifacts and used to seed or extend
# CODEX_CWD/config/config.properties on first install and upgrades.
#
# Paths may be absolute or relative to this file's folder.
# Variables may reference earlier keys using ${name}.
# From vault-graph/config/, ../.. points to the repo root.
codex_cwd=/Users/RVIJAYAN/Documents/work/codex/localsend
# Vaults are managed at runtime under:
# ${codex_cwd}/_state/vaults/<vault-name>/vault.json
graph_max_nodes=200
# Extend concept noise words (comma-separated or JSON array). Example:
# concept_noise_words=pfa,eg,check
concept_noise_words=pfa,eg,check,ie
# Keep the KeyBERT model inside the repo-local ignored folder by default.
keybert_model_name=all-MiniLM-L6-v2
keybert_model_path=${codex_cwd}/keybert/${keybert_model_name}

port=8000
user_id=

# Codex CLI chat bridge (POC)
# This enables a simple in-UI chat panel that spawns `codex exec` as a subprocess and streams output.
codex_chat_enabled=true
# Use your existing Codex config + auth:
codex_home=${home}/.codex
# Optional extra local folders that Codex may access alongside codex_cwd.
# Use the OS path separator (`:` on macOS/Linux, `;` on Windows) or a JSON array.
# Example:
# codex_add_dirs=/Users/me/logs:/Users/me/src/other-repo
# If you still hit sandbox access issues for external folders, consider:
# codex_sandbox=workspace-write

# Experimental live browsing support for browser-backed sessions.
# Opt-in only. If this key is missing, the feature stays off and the UI hides it.
browser_live_browsing_enabled=true

# Optional pip/index overrides for environments that must use an internal package mirror.
# Example:
# pip_index_url=https://your-org-pypi.example.com/simple
# pip_extra_index_url=https://your-org-extra.example.com/simple
# pip_trusted_host=your-org-pypi.example.com

# Installer/update read-only OCI base URL. Leave blank or set to null to disable
# the in-app Check for Update action.
installer_base_url=https://objectstorage.ap-seoul-1.oraclecloud.com/p/vqHG5Za7XyJd8hCzfB-qd1V6SevieUEXJ7LXakmysUsXTcOEkpLoG0OcNhG6xm_W/n/cnvubmbktlyh/b/artifactory/o/antirag
